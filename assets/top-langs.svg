<svg
  width="300"
  height="195"
  viewBox="0 0 300 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #fe428e;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 500 12px 'Inter', Ubuntu, Sans-Serif;
      fill: #a9fef7;
    }
    .lang-pct {
      font: 600 12px 'Inter', Ubuntu, Sans-Serif;
      fill: #a9fef7;
      text-anchor: end;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.4s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="12"
    height="99%"
    width="299"
    fill="#141321"
    stroke="#fe428e"
    stroke-opacity="0.15"
  />

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">My Programming Languages</text>
  </g>

  <g transform="translate(25, 50)">
    <g class="stagger" style="animation-delay: 150ms" transform="translate(0, 0)">
      <circle cx="5" cy="8" r="4" fill="#f1e05a" />
      <text x="16" y="12" class="lang-name">JavaScript</text>
      <text x="250" y="12" class="lang-pct">38.5%</text>
      <rect x="0" y="18" width="250" height="6" rx="3" fill="#222138" />
      <rect x="0" y="18" width="96.3" height="6" rx="3" fill="#f1e05a" />
    </g>
    <g class="stagger" style="animation-delay: 300ms" transform="translate(0, 27)">
      <circle cx="5" cy="8" r="4" fill="#b07219" />
      <text x="16" y="12" class="lang-name">Java</text>
      <text x="250" y="12" class="lang-pct">24.6%</text>
      <rect x="0" y="18" width="250" height="6" rx="3" fill="#222138" />
      <rect x="0" y="18" width="61.5" height="6" rx="3" fill="#b07219" />
    </g>
    <g class="stagger" style="animation-delay: 450ms" transform="translate(0, 54)">
      <circle cx="5" cy="8" r="4" fill="#663399" />
      <text x="16" y="12" class="lang-name">CSS</text>
      <text x="250" y="12" class="lang-pct">11.1%</text>
      <rect x="0" y="18" width="250" height="6" rx="3" fill="#222138" />
      <rect x="0" y="18" width="27.8" height="6" rx="3" fill="#663399" />
    </g>
    <g class="stagger" style="animation-delay: 600ms" transform="translate(0, 81)">
      <circle cx="5" cy="8" r="4" fill="#e34c26" />
      <text x="16" y="12" class="lang-name">HTML</text>
      <text x="250" y="12" class="lang-pct">10.6%</text>
      <rect x="0" y="18" width="250" height="6" rx="3" fill="#222138" />
      <rect x="0" y="18" width="26.5" height="6" rx="3" fill="#e34c26" />
    </g>
    <g class="stagger" style="animation-delay: 750ms" transform="translate(0, 108)">
      <circle cx="5" cy="8" r="4" fill="#f34b7d" />
      <text x="16" y="12" class="lang-name">C++</text>
      <text x="250" y="12" class="lang-pct">9.5%</text>
      <rect x="0" y="18" width="250" height="6" rx="3" fill="#222138" />
      <rect x="0" y="18" width="23.8" height="6" rx="3" fill="#f34b7d" />
    </g>
  </g>
</svg>