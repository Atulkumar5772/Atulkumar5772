<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="gcs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020611"/>
      <stop offset="50%" stop-color="#071124"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a162b"/>
      <stop offset="50%" stop-color="#0f2244"/>
      <stop offset="100%" stop-color="#0a162b"/>
    </linearGradient>

    <!-- Glowing Lines -->
    <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.9"/>
    </linearGradient>

    <radialGradient id="redzone-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#b91c1c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.05"/>
    </radialGradient>

    <!-- Map Cartography Background Grid -->
    <pattern id="tactical-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f3ff" stroke-opacity="0.05" stroke-width="0.7"/>
    </pattern>

    <!-- Glow & Shadow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="alert-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Path for Artificial Horizon (Attitude Gyro) -->
    <clipPath id="horizon-clip">
      <circle cx="615" cy="118" r="32"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .hud-title { font-family: 'Segoe UI', -apple-system, system-ui, sans-serif; font-weight: 800; letter-spacing: 1.2px; }
    @keyframes pulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.35; }
    }
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulse-fast { animation: pulse 1.6s ease-in-out infinite; }
  </style>

  <!-- ================= OUTER FRAME ================= -->
  <rect x="8" y="8" width="744" height="464" rx="14" fill="url(#gcs-bg)" stroke="#00f3ff" stroke-opacity="0.35" stroke-width="1.5" filter="url(#neon-glow)"/>
  <rect x="10" y="10" width="740" height="460" rx="12" fill="url(#tactical-grid)"/>

  <!-- Tactical Corner Accents -->
  <path d="M 18 32 L 18 18 L 32 18" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <path d="M 742 32 L 742 18 L 728 18" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <path d="M 18 448 L 18 462 L 32 462" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <path d="M 742 448 L 742 462 L 728 462" fill="none" stroke="#00f3ff" stroke-width="2.5"/>

  <!-- ================= TOP HEADER BAR ================= -->
  <rect x="14" y="14" width="732" height="38" rx="8" fill="url(#header-grad)" stroke="#1e293b" stroke-width="1"/>
  <line x1="14" y1="52" x2="746" y2="52" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- System Health Status Dot -->
  <circle cx="34" cy="33" r="4.5" fill="#10b981" class="pulse-fast"/>
  <circle cx="34" cy="33" r="8" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>

  <!-- Main Title -->
  <text x="50" y="37" class="hud-title" font-size="13" fill="#ffffff">GARUDA AERO GCS</text>
  <text x="195" y="37" class="mono" font-size="10" fill="#38bdf8">| AUTONOMOUS DRONE FLIGHT OPERATING SYSTEM</text>

  <!-- Top Status Badges -->
  <rect x="505" y="23" width="105" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="514" y="37" class="mono" font-size="9" font-weight="700" fill="#a5b4fc">DGCA AIRSPACE OK</text>

  <rect x="618" y="23" width="118" height="20" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <circle cx="628" cy="33" r="3" fill="#34d399"/>
  <text x="636" y="37" class="mono" font-size="9" font-weight="700" fill="#34d399">18 GPS • RTK FIX</text>

  <!-- ================= MAIN MAP AREA (LEFT 470px) ================= -->
  <g transform="translate(24, 62)">
    <!-- Map Container Screen -->
    <rect x="0" y="0" width="465" height="355" rx="8" fill="#050e1c" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Map Header Strip -->
    <rect x="0" y="0" width="465" height="24" rx="8" fill="#08162c"/>
    <text x="12" y="16" class="mono" font-size="9.5" font-weight="700" fill="#38bdf8">AIRSPACE MAP • JAIPUR SECTOR (JAI / VIKAS MARG)</text>
    <text x="360" y="16" class="mono" font-size="8.5" fill="#64748b">SCALE: 1:15,000</text>

    <!-- Stylized Airport Runways (Jaipur International Airport - Runway 09/27) -->
    <g transform="translate(340, 150) rotate(-22)">
      <!-- Main Runway Strip -->
      <rect x="-80" y="-8" width="160" height="16" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <!-- Runway Centerline Dashes -->
      <line x1="-70" y1="0" x2="70" y2="0" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>
      <!-- Threshold markings -->
      <line x1="-76" y1="-5" x2="-76" y2="5" stroke="#f8fafc" stroke-width="2"/>
      <line x1="76" y1="-5" x2="76" y2="5" stroke="#f8fafc" stroke-width="2"/>
      <text x="-70" y="18" class="mono" font-size="7" fill="#94a3b8">RWY 09</text>
      <text x="50" y="18" class="mono" font-size="7" fill="#94a3b8">RWY 27</text>
    </g>

    <!-- Radar Range Rings -->
    <circle cx="230" cy="185" r="130" fill="none" stroke="#00f3ff" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="230" cy="185" r="85" fill="none" stroke="#00f3ff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="230" cy="185" r="40" fill="none" stroke="#00f3ff" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Crosshair axes -->
    <line x1="230" y1="35" x2="230" y2="335" stroke="#00f3ff" stroke-opacity="0.07" stroke-width="1"/>
    <line x1="80" y1="185" x2="380" y2="185" stroke="#00f3ff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- ================= DGCA RED NO-FLY ZONE ================= -->
    <g transform="translate(330, 150)">
      <!-- Red Zone Radial Fill & Outer Hazard Stroke -->
      <circle cx="0" cy="0" r="82" fill="url(#redzone-grad)" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6,4" filter="url(#alert-glow)"/>
      <circle cx="0" cy="0" r="82" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.5"/>
      <!-- Warning Badge positioned in upper region of circle -->
      <rect x="-68" y="-70" width="136" height="26" rx="4" fill="#450a0a" fill-opacity="0.9" stroke="#ef4444" stroke-width="1"/>
      <text x="0" y="-57" class="mono" font-size="8.5" font-weight="700" fill="#fca5a5" text-anchor="middle">🚫 DGCA RED NO-FLY ZONE</text>
      <text x="0" y="-47" class="mono" font-size="7.5" fill="#f87171" text-anchor="middle">JAIPUR AIRPORT 1500m BUFFER</text>
    </g>

    <!-- ================= FLIGHT ROUTE & WAYPOINTS ================= -->
    <!-- Safe Flight Route Path: HOME -> WP1 -> DRONE -> WP3 -->
    <path d="M 60 305 L 140 230 L 220 165 L 175 90" fill="none" stroke="#00f3ff" stroke-width="2.5" stroke-dasharray="6,3" filter="url(#neon-glow)"/>

    <!-- HOME BASE (WP-00) -->
    <g transform="translate(60, 305)">
      <circle cx="0" cy="0" r="8" fill="#10b981"/>
      <circle cx="0" cy="0" r="14" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,3"/>
      <rect x="-38" y="16" width="76" height="18" rx="3" fill="#022c22" stroke="#10b981" stroke-width="0.8"/>
      <text x="0" y="28" class="mono" font-size="8" font-weight="700" fill="#6ee7b7" text-anchor="middle">HOME / RTH</text>
    </g>

    <!-- WAYPOINT 1 (TAKEOFF & CLIMB) -->
    <g transform="translate(140, 230)">
      <circle cx="0" cy="0" r="6" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="-42" y="-24" width="84" height="16" rx="3" fill="#082f49" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="0" y="-13" class="mono" font-size="7.5" font-weight="700" fill="#7dd3fc" text-anchor="middle">WP-01 [TAKEOFF]</text>
    </g>

    <!-- WAYPOINT 3 (MISSION TARGET / RECONNAISSANCE) -->
    <g transform="translate(175, 90)">
      <circle cx="0" cy="0" r="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
      <!-- Clearly labeled TARGET AREA / SURVEY to avoid any confusion -->
      <rect x="-48" y="-24" width="96" height="16" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="0" y="-13" class="mono" font-size="7.5" font-weight="700" fill="#fde68a" text-anchor="middle">WP-03 [SURVEY AREA]</text>
    </g>

    <!-- ================= ACTIVE DRONE IN-FLIGHT ================= -->
    <g transform="translate(220, 165)">
      <!-- Animated Bearing Cone (Heading Angle 042°) -->
      <g transform="rotate(42)">
        <!-- Heading Beam -->
        <polygon points="0,-10 -15,-50 15,-50" fill="#00f3ff" fill-opacity="0.12"/>
        <line x1="0" y1="0" x2="0" y2="-45" stroke="#00f3ff" stroke-width="1.2" stroke-dasharray="3,2"/>
        
        <!-- Quadcopter Frame -->
        <line x1="-16" y1="-16" x2="16" y2="16" stroke="#cbd5e1" stroke-width="2.5"/>
        <line x1="-16" y1="16" x2="16" y2="-16" stroke="#cbd5e1" stroke-width="2.5"/>
        
        <!-- 4 Spinning Rotor Discs -->
        <circle cx="-16" cy="-16" r="7" fill="#00f3ff" fill-opacity="0.35" stroke="#00f3ff" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="7" fill="#00f3ff" fill-opacity="0.35" stroke="#00f3ff" stroke-width="1.2"/>
        <circle cx="-16" cy="16" r="7" fill="#00f3ff" fill-opacity="0.35" stroke="#00f3ff" stroke-width="1.2"/>
        <circle cx="16" cy="-16" r="7" fill="#00f3ff" fill-opacity="0.35" stroke="#00f3ff" stroke-width="1.2"/>

        <!-- Center Drone Core & Nose -->
        <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#00f3ff" stroke-width="2"/>
        <polygon points="0,-12 -4,-6 4,-6" fill="#ef4444"/>
      </g>

      <!-- Clean Drone Telemetry Callout Box (Positioned cleanly below the drone) -->
      <g transform="translate(-65, 30)">
        <rect x="0" y="0" width="130" height="38" rx="4" fill="#030712" fill-opacity="0.9" stroke="#00f3ff" stroke-width="1.2"/>
        <text x="8" y="15" class="mono" font-size="9" font-weight="700" fill="#00f3ff">UAV-GARUDA-01</text>
        <rect x="94" y="6" width="28" height="12" rx="2" fill="#065f46"/>
        <text x="108" y="15" class="mono" font-size="7.5" font-weight="700" fill="#34d399" text-anchor="middle">LIVE</text>
        <text x="8" y="29" class="mono" font-size="8" fill="#94a3b8">ALT: 45.2m | SPD: 14.8m/s</text>
      </g>
    </g>

    <!-- Map Lower Controls Overlay -->
    <rect x="10" y="320" width="210" height="24" rx="4" fill="#030813" fill-opacity="0.88" stroke="#1e293b" stroke-width="1"/>
    <text x="18" y="336" class="mono" font-size="8.5" fill="#38bdf8">🗺️ ESRI SATELLITE HUD • ZOOM 15</text>
  </g>

  <!-- ================= RIGHT TELEMETRY DASHBOARD (240px) ================= -->
  <g transform="translate(500, 62)">
    <!-- Dashboard Container -->
    <rect x="0" y="0" width="236" height="355" rx="8" fill="#071324" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Dashboard Header -->
    <rect x="0" y="0" width="236" height="28" rx="8" fill="#0c1d38"/>
    <text x="14" y="18" class="hud-title" font-size="11" fill="#38bdf8">MISSION TELEMETRY</text>
    <circle cx="218" cy="14" r="3.5" fill="#10b981" class="pulse-fast"/>

    <!-- ================= ATTITUDE INDICATOR (ARTIFICIAL HORIZON) ================= -->
    <g transform="translate(20, 38)">
      <!-- Bezel ring -->
      <circle cx="40" cy="40" r="36" fill="#0a101d" stroke="#334155" stroke-width="2"/>
      
      <!-- Horizon Ball (Sky / Ground) -->
      <g clip-path="url(#horizon-clip)" transform="translate(-575, -78)">
        <!-- Blue Sky -->
        <rect x="580" y="80" width="70" height="38" fill="#0284c7"/>
        <!-- Brown/Amber Ground -->
        <rect x="580" y="118" width="70" height="38" fill="#78350f"/>
        <!-- Horizon White Line -->
        <line x1="580" y1="118" x2="650" y2="118" stroke="#ffffff" stroke-width="1.5"/>
      </g>
      
      <!-- Pitch reference crosshair -->
      <line x1="28" y1="40" x2="36" y2="40" stroke="#facc15" stroke-width="2"/>
      <line x1="44" y1="40" x2="52" y2="40" stroke="#facc15" stroke-width="2"/>
      <circle cx="40" cy="40" r="2.5" fill="#facc15"/>

      <!-- Attitude Label & Heading Data beside the horizon ball -->
      <text x="88" y="25" class="mono" font-size="8.5" fill="#94a3b8">HEADING (BEARING)</text>
      <text x="88" y="44" class="mono" font-size="15" font-weight="700" fill="#00f3ff">042° NE</text>
      <text x="88" y="60" class="mono" font-size="7.5" fill="#38bdf8">SPHERICAL HAVERSINE</text>
    </g>

    <line x1="12" y1="124" x2="224" y2="124" stroke="#1e293b" stroke-width="1"/>

    <!-- ================= TELEMETRY GAUGES ================= -->
    <!-- Metric 1: Altitude -->
    <g transform="translate(14, 134)">
      <text x="0" y="11" class="mono" font-size="9" fill="#94a3b8">ALTITUDE (AGL)</text>
      <text x="208" y="11" class="mono" font-size="12" font-weight="700" fill="#00f3ff" text-anchor="end">45.2 m</text>
      <rect x="0" y="17" width="208" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="0" y="17" width="135" height="5" rx="2.5" fill="#00f3ff"/>
    </g>

    <!-- Metric 2: Ground Speed -->
    <g transform="translate(14, 168)">
      <text x="0" y="11" class="mono" font-size="9" fill="#94a3b8">GROUND SPEED</text>
      <text x="208" y="11" class="mono" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">14.8 m/s (53 km/h)</text>
      <rect x="0" y="17" width="208" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="0" y="17" width="115" height="5" rx="2.5" fill="#38bdf8"/>
    </g>

    <!-- Metric 3: Battery Level -->
    <g transform="translate(14, 202)">
      <text x="0" y="11" class="mono" font-size="9" fill="#94a3b8">BATTERY (6S LiPo)</text>
      <text x="208" y="11" class="mono" font-size="12" font-weight="700" fill="#10b981" text-anchor="end">89% • 22.8V</text>
      <rect x="0" y="17" width="208" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="0" y="17" width="185" height="5" rx="2.5" fill="#10b981"/>
    </g>

    <!-- Metric 4: Distance to Home -->
    <g transform="translate(14, 236)">
      <text x="0" y="11" class="mono" font-size="9" fill="#94a3b8">DISTANCE TO HOME</text>
      <text x="208" y="11" class="mono" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="end">384 m</text>
      <rect x="0" y="17" width="208" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="0" y="17" width="85" height="5" rx="2.5" fill="#f59e0b"/>
    </g>

    <!-- Flight Modes & Safety Lock Card -->
    <g transform="translate(14, 270)">
      <rect x="0" y="0" width="100" height="38" rx="4" fill="#081c33" stroke="#0284c7" stroke-width="1"/>
      <text x="8" y="13" class="mono" font-size="7.5" fill="#7dd3fc">FLIGHT MODE</text>
      <text x="8" y="28" class="mono" font-size="10" font-weight="700" fill="#ffffff">WAYPOINT</text>

      <rect x="108" y="0" width="100" height="38" rx="4" fill="#1f1308" stroke="#d97706" stroke-width="1"/>
      <text x="116" y="13" class="mono" font-size="7.5" fill="#fcd34d">AIRSPACE LOCK</text>
      <text x="116" y="28" class="mono" font-size="10" font-weight="700" fill="#fbbf24">AUTO-RTH ON</text>
    </g>

    <!-- Spring Boot 3 Engine Badge -->
    <g transform="translate(14, 316)">
      <rect x="0" y="0" width="208" height="28" rx="4" fill="#052418" stroke="#059669" stroke-width="1"/>
      <circle cx="12" cy="14" r="3.5" fill="#10b981"/>
      <text x="22" y="13" class="mono" font-size="8" font-weight="700" fill="#34d399">SPRING BOOT 3.3.4 ENGINE</text>
      <text x="22" y="23" class="mono" font-size="7" fill="#6ee7b7">1000ms Physics Heartbeat • MySQL JPA</text>
    </g>
  </g>

  <!-- ================= BOTTOM CONSOLE TICKER ================= -->
  <rect x="24" y="426" width="712" height="34" rx="6" fill="#06111e" stroke="#1e293b" stroke-width="1"/>
  <circle cx="38" cy="443" r="3.5" fill="#22c55e" class="pulse-fast"/>
  <text x="48" y="446" class="mono" font-size="9" font-weight="700" fill="#22c55e">SYSTEM STATUS: OPTIMAL</text>
  <text x="180" y="446" class="mono" font-size="8.5" fill="#94a3b8">| DGCA Virtual Wall: Armed | Haversine GeoEngine: 60 FPS | REST API: 200 OK | Lat: 26.8312° N, Lon: 75.8105° E</text>
</svg>