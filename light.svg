<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <radialGradient id="screen-glow-light" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f8fafc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#eef6ff" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="neon-blue-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="stream-flow-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <filter id="cyan-glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="matrix-dots-light" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.75" fill="#0284c7" opacity="0.18"/>
    </pattern>

    <linearGradient id="flow-gradient-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="22%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="78%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <path id="outer-flow-path-l"
          d="M35 35 H1065 Q1080 35 1080 50 V630 Q1080 645 1065 645 H35 Q20 645 20 630 V50 Q20 35 35 35"
          fill="none"/>
    <path id="left-flow-path-l"
          d="M49 75 H491 Q505 75 505 89 V556 Q505 570 491 570 H49 Q35 570 35 556 V89 Q35 75 49 75"
          fill="none"/>
    <path id="right-flow-path-l"
          d="M539 75 H1036 Q1050 75 1050 89 V556 Q1050 570 1036 570 H539 Q525 570 525 556 V89 Q525 75 539 75"
          fill="none"/>

    <clipPath id="portrait-clip-light">
      <rect x="10" y="24" width="450" height="460" rx="8"/>
    </clipPath>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .label-cyan { fill: #0284c7; font-weight: 600; }
    .muted-dots { fill: #cbd5e1; letter-spacing: 2px; }
    .white-text { fill: #0f172a; }
    
    @keyframes pulse-flow {
      0%, 100% { opacity: 0.35; stroke-dashoffset: 0; }
      50% { opacity: 0.85; stroke-dashoffset: -40; }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes radar-scan {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(440px); opacity: 0; }
    }
    .radar-line { animation: radar-scan 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .cursor-blink { animation: blink 0.9s infinite; }
    .animated-wire { stroke-dasharray: 8 12; animation: pulse-flow 3s linear infinite; }

    .flow-border {
      fill: none;
      stroke: url(#flow-gradient-light);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 26 150;
    }
    .flow-border-soft {
      fill: none;
      stroke: #0284c7;
      stroke-width: 1;
      stroke-opacity: 0.25;
      stroke-dasharray: 4 18;
    }
    .flow-particle { fill: #0284c7; }
    .flow-particle-purple { fill: #7c3aed; }
    .avatar-stroke-light {
      fill: none;
      stroke: #0284c7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <rect x="15" y="15" width="1070" height="650" rx="20" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" stroke-opacity="0.8"/>
  <rect x="18" y="18" width="1064" height="644" rx="18" fill="url(#screen-glow-light)"/>

  <g pointer-events="none">
    <use href="#outer-flow-path-l" class="flow-border-soft">
      <animate attributeName="stroke-dashoffset" from="0" to="-110" dur="9s" repeatCount="indefinite"/>
    </use>
    <use href="#left-flow-path-l" class="flow-border-soft">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#right-flow-path-l" class="flow-border-soft">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="8s" repeatCount="indefinite"/>
    </use>

    <circle r="3.2" class="flow-particle">
      <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#outer-flow-path-l"/>
      </animateMotion>
    </circle>
    <circle r="2.6" class="flow-particle">
      <animateMotion dur="4.7s" begin="-1.1s" repeatCount="indefinite" rotate="auto">
        <mpath href="#left-flow-path-l"/>
      </animateMotion>
    </circle>
  </g>

