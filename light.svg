<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <!-- Background & Terminal Gradients (Light Theme) -->
    <radialGradient id="screen-glow-light" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#f8fafc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#eef6ff" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="neon-blue-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="stream-flow-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="blue-glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Matrix Dot Pattern -->
    <pattern id="matrix-dots-light" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.8" fill="#0284c7" opacity="0.18"/>
    </pattern>

    <!-- Scanline Mask -->
    <linearGradient id="scan-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Animated blue flow -->
    <linearGradient id="flow-gradient-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="22%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="78%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Portrait Contours Gradient -->
    <linearGradient id="portrait-glow-grad-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Motion Paths -->
    <path id="outer-flow-path-light"
          d="M35 35 H1065 Q1080 35 1080 50 V630 Q1080 645 1065 645 H35 Q20 645 20 630 V50 Q20 35 35 35"
          fill="none"/>

    <path id="left-flow-path-light"
          d="M49 75 H491 Q505 75 505 89 V556 Q505 570 491 570 H49 Q35 570 35 556 V89 Q35 75 49 75"
          fill="none"/>

    <path id="right-flow-path-light"
          d="M539 75 H1036 Q1050 75 1050 89 V556 Q1050 570 1036 570 H539 Q525 570 525 556 V89 Q525 75 539 75"
          fill="none"/>

    <clipPath id="left-panel-clip-light">
      <rect x="10" y="24" width="450" height="460" rx="8"/>
    </clipPath>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .label-blue { fill: #0284c7; font-weight: 700; }
    .muted-dots-light { fill: #cbd5e1; letter-spacing: 3px; font-weight: 400; }
    .dark-text { fill: #0f172a; font-weight: 600; }
    .sub-text-light { fill: #64748b; }
    
    @keyframes pulse-flow {
      0%, 100% { opacity: 0.35; stroke-dashoffset: 0; }
      50% { opacity: 0.85; stroke-dashoffset: -40; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes radar-scan {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(440px); opacity: 0; }
    }
    .radar-line {
      animation: radar-scan 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .cursor-blink {
      animation: blink 0.9s infinite;
    }
    .animated-wire-light {
      stroke-dasharray: 8 12;
      animation: pulse-flow 3s linear infinite;
    }

    .flow-border-light {
      fill: none;
      stroke: url(#flow-gradient-light);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 26 150;
    }
    .flow-border-soft-light {
      fill: none;
      stroke: #0284c7;
      stroke-width: 1;
      stroke-opacity: 0.25;
      stroke-dasharray: 4 18;
    }
    .flow-particle-light {
      fill: #0284c7;
    }
    .flow-particle-purple-light {
      fill: #7c3aed;
    }

    .cyber-line-light {
      stroke: url(#portrait-glow-grad-light);
      stroke-linecap: round;
      fill: none;
    }
  </style>

  <!-- Outer Display Housing -->
  <rect x="15" y="15" width="1070" height="650" rx="20" fill="#f8fafc" stroke="#0284c7" stroke-width="1.8" stroke-opacity="0.8"/>
  <rect x="18" y="18" width="1064" height="644" rx="18" fill="url(#screen-glow-light)"/>

  <!-- Flow System -->
  <g pointer-events="none">
    <use href="#outer-flow-path-light" class="flow-border-soft-light">
      <animate attributeName="stroke-dashoffset" from="0" to="-110" dur="9s" repeatCount="indefinite"/>
    </use>
    <use href="#left-flow-path-light" class="flow-border-soft-light">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="7s" repeatCount="indefinite"/>
    </use>
    <use href="#right-flow-path-light" class="flow-border-soft-light">
      <animate attributeName="stroke-dashoffset" from="0" to="-90" dur="8s" repeatCount="indefinite"/>
    </use>

    <use href="#outer-flow-path-light" class="flow-border-light">
      <animate attributeName="stroke-dashoffset" from="0" to="-880" dur="6s" repeatCount="indefinite"/>
    </use>
    <use href="#left-flow-path-light" class="flow-border-light">
      <animate attributeName="stroke-dashoffset" from="0" to="-620" dur="5s" repeatCount="indefinite"/>
    </use>
    <use href="#right-flow-path-light" class="flow-border-light">
      <animate attributeName="stroke-dashoffset" from="0" to="-620" dur="5.8s" begin="-1.4s" repeatCount="indefinite"/>
    </use>

    <circle r="3.2" class="flow-particle-light">
      <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto">
        <mpath href="#outer-flow-path-light"/>
      </animateMotion>
    </circle>
    <circle r="2.2" class="flow-particle-purple-light">
      <animateMotion dur="7s" begin="-2.2s" repeatCount="indefinite" rotate="auto">
        <mpath href="#outer-flow-path-light"/>
      </animateMotion>
    </circle>
    <circle r="2.6" class="flow-particle-light">
      <animateMotion dur="4.7s" begin="-1.1s" repeatCount="indefinite" rotate="auto">
        <mpath href="#left-flow-path-light"/>
      </animateMotion>
    </circle>
    <circle r="2.6" class="flow-particle-purple-light">
      <animateMotion dur="5.2s" begin="-2.7s" repeatCount="indefinite" rotate="auto">
        <mpath href="#right-flow-path-light"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Top Bar Navigation -->
  <circle cx="48" cy="46" r="6" fill="#ff5f56"/>
  <circle cx="68" cy="46" r="6" fill="#ffbd2e"/>
  <circle cx="88" cy="46" r="6" fill="#27c93f"/>

  <text x="114" y="50" class="font-mono label-blue" font-size="14">atulkumar/README.md</text>

