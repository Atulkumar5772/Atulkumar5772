      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF6FF" />
    </linearGradient>

    <linearGradient id="lightBorder" x1="0%" y1="0%" x2="100%" y2="100%">
