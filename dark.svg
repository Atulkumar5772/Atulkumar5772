      <text x="110" y="15" text-anchor="middle" class="mono pill-text" fill="#94A3B8">STACK</text>

      <rect x="150" y="0" width="80" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="190" y="15" text-anchor="middle" class="mono pill-text" fill="#94A3B8">PROJECTS</text>

