<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Atul Kumar - Red Hat Intern and Systems Developer Cyber Hero Banner">
  <defs>
    <!-- Dynamic Animated Gradients -->
    <linearGradient id="cyberBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#070E22" />
      <stop offset="100%" stop-color="#0A1128" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="animatedBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#7C3AED;#10B981;#00F5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#10B981;#00F5FF;#7C3AED" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#00F5FF;#7C3AED;#10B981" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>

    <!-- Glass Panel Fill -->
    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.65" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00F5FF" stroke-opacity="0.05" stroke-width="1" />
    </pattern>

    <!-- Futuristic Grid Pattern -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00F5FF" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#38BDF8" fill-opacity="0.2" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .text-title { font-size: 34px; font-weight: 800; fill: url(#titleGlowGrad); letter-spacing: -0.5px; }
    .text-headline { font-size: 14.5px; font-weight: 600; fill: #00F5FF; letter-spacing: 0.5px; }
    .text-muted { font-size: 13px; font-weight: 400; fill: #94A3B8; }
    .text-cyan { font-size: 13px; font-weight: 600; fill: #38BDF8; }
    .text-emerald { font-size: 13px; font-weight: 600; fill: #10B981; }
    .text-white { font-size: 13px; font-weight: 500; fill: #F8FAFC; }
    .ascii-text { font-size: 9.5px; fill: #38BDF8; line-height: 11.5px; }
    .pill-text { font-size: 11px; font-weight: 700; fill: #F1F5F9; }
  </style>

  <!-- ==================== BACKGROUND & MESH ==================== -->
  <rect width="1180" height="610" rx="24" fill="url(#cyberBgGrad)" />
  <rect width="1180" height="610" rx="24" fill="url(#cyberGrid)" />
  <rect width="1180" height="610" rx="24" fill="url(#scanlines)" />
  
  <!-- Outer Animated Glowing Border -->
  <rect width="1176" height="606" x="2" y="2" rx="23" fill="none" stroke="url(#animatedBorder)" stroke-width="2" filter="url(#subtleGlow)" />

  <!-- Animated Glowing Neon Background Orbs -->
  <circle cx="160" cy="140" r="160" fill="#7C3AED" fill-opacity="0.16" filter="url(#neonGlow)">
    <animate attributeName="r" values="140;190;140" dur="7s" repeatCount="indefinite" />
    <animate attributeName="cx" values="160;180;160" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="480" r="180" fill="#00F5FF" fill-opacity="0.12" filter="url(#neonGlow)">
    <animate attributeName="r" values="160;210;160" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="480;450;480" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="300" r="120" fill="#10B981" fill-opacity="0.08" filter="url(#neonGlow)">
    <animate attributeName="r" values="100;140;100" dur="11s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== TOP WINDOW CONTROLS & HEADER ==================== -->
  <g transform="translate(30, 24)">
    <!-- Terminal Dots with Pulse -->
    <circle cx="10" cy="12" r="6" fill="#EF4444" />
    <circle cx="28" cy="12" r="6" fill="#F59E0B" />
    <circle cx="46" cy="12" r="6" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Terminal Hostname -->
    <text x="70" y="16" class="mono text-muted" font-size="13">
      atul@piet-rhel:~ <tspan fill="#38BDF8">[</tspan><tspan fill="#10B981">● SYSTEM_ONLINE</tspan><tspan fill="#38BDF8">]</tspan>
    </text>

    <!-- Top Navigation Tags -->
    <g transform="translate(810, 0)">
      <rect width="80" height="24" rx="6" fill="#0F172A" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="1" />
      <text x="40" y="16" text-anchor="middle" class="mono pill-text" fill="#38BDF8">SYSTEM</text>

      <rect x="88" y="0" width="75" height="24" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1" />
      <text x="125" y="16" text-anchor="middle" class="mono pill-text" fill="#C084FC">STACK</text>

      <rect x="171" y="0" width="90" height="24" rx="6" fill="#0F172A" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
      <text x="216" y="16" text-anchor="middle" class="mono pill-text" fill="#34D399">PROJECTS</text>

      <rect x="269" y="0" width="48" height="24" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1" />
      <text x="293" y="16" text-anchor="middle" class="mono pill-text" fill="#6EE7B7">LIVE</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="30" y1="58" x2="1150" y2="58" stroke="#334155" stroke-opacity="0.5" stroke-width="1" />

  <!-- ==================== LEFT COLUMN (IDENTITY & VISUAL.MAP) ==================== -->
  <g transform="translate(30, 75)">
    <!-- Left Glass Panel -->
    <rect width="440" height="505" rx="16" fill="url(#glassPanel)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Panel Header Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 424 0 Q 440 0 440 16 L 440 36 L 0 36 Z" fill="#0B132B" fill-opacity="0.9" />
    <text x="16" y="23" class="mono text-cyan" font-size="12" font-weight="700">VISUAL.MAP // CORE_ENGINE</text>
    <circle cx="418" cy="18" r="5" fill="#00F5FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>

    <!-- ASCII Terminal Box with Scanline Sweep -->
    <g transform="translate(20, 50)">
      <rect width="400" height="270" rx="10" fill="#030712" stroke="#1E293B" stroke-width="1.2" />
      
      <!-- Moving Cyan Laser Scanline inside ASCII Box -->
      <line x1="10" y1="0" x2="390" y2="0" stroke="#00F5FF" stroke-width="1.5" stroke-opacity="0.7" filter="url(#subtleGlow)">
        <animate attributeName="y1" values="20;250;20" dur="5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="20;250;20" dur="5s" repeatCount="indefinite" />
      </line>

      <!-- ASCII Graphic Art -->
      <g class="mono ascii-text" transform="translate(25, 24)">
        <text y="14" fill="#64748B">/* --- ATUL KUMAR // SYSTEMS ARCHITECTURE --- */</text>
        <text y="30" fill="#EE0000" font-weight="700">        .---.           [ROLE: RED HAT INTERN]</text>
        <text y="44" fill="#EE0000" font-weight="700">       /     \          [OS: RHEL 9 / LINUX]</text>
        <text y="58" fill="#38BDF8">      | () () |         [KERNEL: INOTIFY DAEMON]</text>
        <text y="72" fill="#38BDF8">       \  -  /          [CORE: JAVA • C++ • DSA]</text>
        <text y="86" fill="#38BDF8">      /       \         [CLOUD: SALESFORCE CRM]</text>
        <text y="100" fill="#10B981">     | |     | |        [DATABASE: MYSQL 8.0]</text>
        <text y="114" fill="#10B981">     | |     | |        [LEETCODE: SOLVER]</text>
        <text y="128" fill="#A78BFA">     / \_____/ \        [ACADEMICS: PIET '28]</text>
        <text y="142" fill="#A78BFA">    / /       \ \       [STATUS: ACTIVE_DISPATCH]</text>
        <text y="160" fill="#38BDF8">------------------------------------------------</text>
        <text y="176" fill="#F8FAFC">&gt; Initializing security hooks &amp; system daemons...</text>
        <text y="192" fill="#10B981" font-weight="700">&gt; Status: 100% OPERATIONAL • 0 KERNEL PANICS</text>
      </g>
    </g>

    <!-- Left Bottom Supporting Info -->
    <g transform="translate(24, 335)">
      <text x="0" y="20" class="mono text-muted" font-size="11" letter-spacing="1">PRIMARY PROFILE IDENTITY</text>
      <text x="0" y="46" class="sans" font-size="20" font-weight="800" fill="#FFFFFF">Red Hat Intern • Systems Eng.</text>
      <text x="0" y="68" class="sans text-muted" font-size="13">B.Tech CSE @ Poornima Inst. of Engg. &amp; Tech.</text>

      <!-- Terminal Command Bar with Blinking Cursor -->
      <g transform="translate(0, 85)">
        <rect width="392" height="42" rx="8" fill="#030712" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="14" y="26" class="mono" font-size="13">
          <tspan fill="#38BDF8">~/profile</tspan> <tspan fill="#94A3B8">$</tspan> <tspan fill="#F8FAFC">build --enterprise-ready</tspan>
          <tspan fill="#00F5FF" font-weight="700">
            <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />_
          </tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN (SYSTEM.INFO DASHBOARD) ==================== -->
  <g transform="translate(490, 75)">
    <!-- Right Glass Panel -->
    <rect width="660" height="505" rx="16" fill="url(#glassPanel)" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Panel Header Bar -->
    <path d="M 0 16 Q 0 0 16 0 L 644 0 Q 660 0 660 16 L 660 36 L 0 36 Z" fill="#0B132B" fill-opacity="0.9" />
    <text x="20" y="23" class="mono text-cyan" font-size="12" font-weight="700">SYSTEM.INFO // EXECUTIVE_SUMMARY</text>
    <text x="540" y="23" class="mono text-muted" font-size="11">ENVIRONMENT: PROD</text>

    <!-- Content Container -->
    <g transform="translate(28, 48)">

      <!-- User Title Header -->
      <text x="0" y="28" class="sans text-title">Atul Kumar</text>
      
      <!-- Subtitle Role Tags with Glowing Icon -->
      <g transform="translate(0, 52)">
        <text class="mono text-headline">
          <tspan fill="#00F5FF">⚡ </tspan>
          <tspan fill="#F8FAFC">Red Hat Intern </tspan>
          <tspan fill="#64748B">| </tspan>
          <tspan fill="#38BDF8">Salesforce Developer </tspan>
          <tspan fill="#64748B">| </tspan>
          <tspan fill="#A78BFA">Java &amp; C++ DSA</tspan>
        </text>
      </g>

      <!-- Key Value System Properties Grid -->
      <g transform="translate(0, 76)">
        
        <g transform="translate(0, 0)">
          <text x="0" y="16" class="mono text-cyan">&gt; EXPERIENCE</text>
          <text x="135" y="16" class="sans text-white">Red Hat Intern <tspan fill="#94A3B8">(RHEL Administration &amp; CLI Workflows)</tspan></text>
        </g>

        <g transform="translate(0, 26)">
          <text x="0" y="16" class="mono text-cyan">&gt; EDUCATION</text>
          <text x="135" y="16" class="sans text-white">B.Tech in CSE @ PIET, Jaipur <tspan fill="#94A3B8">(2024 – 2028)</tspan></text>
        </g>

        <g transform="translate(0, 52)">
          <text x="0" y="16" class="mono text-cyan">&gt; CORE FOCUS</text>
          <text x="135" y="16" class="sans text-white">Linux Kernel Inotify, System Daemons, OOP &amp; DSA</text>
        </g>

        <g transform="translate(0, 78)">
          <text x="0" y="16" class="mono text-cyan">&gt; ACTIVE WORK</text>
          <text x="135" y="16" class="sans text-white">Sentinel-Guard <tspan fill="#10B981">[Security Daemon]</tspan> &amp; LeetCode DSA</text>
        </g>
      </g>

      <!-- Section: Glowing Tech Stack Badges Grid -->
      <g transform="translate(0, 195)">
        <text x="0" y="0" class="mono text-muted" font-size="11" letter-spacing="1">PRIMARY TECHNICAL ARSENAL</text>

        <!-- Pills Row 1 -->
        <g transform="translate(0, 12)">
          <!-- Red Hat -->
          <rect width="84" height="26" rx="6" fill="#EE0000" fill-opacity="0.18" stroke="#EE0000" stroke-width="1.2" />
          <text x="42" y="17" text-anchor="middle" class="mono pill-text" fill="#FF4D4D">Red Hat</text>

          <!-- Linux -->
          <rect x="92" y="0" width="70" height="26" rx="6" fill="#0F172A" stroke="#FCC624" stroke-width="1.2" />
          <text x="127" y="17" text-anchor="middle" class="mono pill-text" fill="#FCC624">Linux</text>

          <!-- C++17 -->
          <rect x="170" y="0" width="68" height="26" rx="6" fill="#0F172A" stroke="#00599C" stroke-width="1.2" />
          <text x="204" y="17" text-anchor="middle" class="mono pill-text" fill="#38BDF8">C++17</text>

          <!-- Java -->
          <rect x="246" y="0" width="62" height="26" rx="6" fill="#0F172A" stroke="#ED8B00" stroke-width="1.2" />
          <text x="277" y="17" text-anchor="middle" class="mono pill-text" fill="#F59E0B">Java</text>

          <!-- Salesforce -->
          <rect x="316" y="0" width="96" height="26" rx="6" fill="#0F172A" stroke="#00A1E0" stroke-width="1.2" />
          <text x="364" y="17" text-anchor="middle" class="mono pill-text" fill="#38BDF8">Salesforce</text>

          <!-- Bash -->
          <rect x="420" y="0" width="64" height="26" rx="6" fill="#0F172A" stroke="#4EAA25" stroke-width="1.2" />
          <text x="452" y="17" text-anchor="middle" class="mono pill-text" fill="#4ADE80">Bash</text>

          <!-- MySQL -->
          <rect x="492" y="0" width="72" height="26" rx="6" fill="#0F172A" stroke="#4479A1" stroke-width="1.2" />
          <text x="528" y="17" text-anchor="middle" class="mono pill-text" fill="#60A5FA">MySQL</text>
        </g>

        <!-- Pills Row 2 -->
        <g transform="translate(0, 46)">
          <rect width="90" height="26" rx="6" fill="#0F172A" stroke="#F7DF1E" stroke-width="1.2" />
          <text x="45" y="17" text-anchor="middle" class="mono pill-text" fill="#FACC15">JavaScript</text>

          <rect x="98" y="0" width="72" height="26" rx="6" fill="#0F172A" stroke="#E34F26" stroke-width="1.2" />
          <text x="134" y="17" text-anchor="middle" class="mono pill-text" fill="#FB923C">HTML5</text>

          <rect x="178" y="0" width="68" height="26" rx="6" fill="#0F172A" stroke="#1572B6" stroke-width="1.2" />
          <text x="212" y="17" text-anchor="middle" class="mono pill-text" fill="#38BDF8">CSS3</text>

          <rect x="254" y="0" width="80" height="26" rx="6" fill="#0F172A" stroke="#007ACC" stroke-width="1.2" />
          <text x="294" y="17" text-anchor="middle" class="mono pill-text" fill="#60A5FA">VS Code</text>

          <rect x="342" y="0" width="74" height="26" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1.2" />
          <text x="379" y="17" text-anchor="middle" class="mono pill-text" fill="#C084FC">IntelliJ</text>

          <rect x="424" y="0" width="80" height="26" rx="6" fill="#0F172A" stroke="#F05032" stroke-width="1.2" />
          <text x="464" y="17" text-anchor="middle" class="mono pill-text" fill="#F87171">Git/GitHub</text>
        </g>
      </g>

      <!-- Section: Featured Projects Compact Cards -->
      <g transform="translate(0, 292)">
        <text x="0" y="0" class="mono text-muted" font-size="11" letter-spacing="1">FEATURED CODE REPOSITORIES</text>

        <!-- Project 1 Card -->
        <g transform="translate(0, 12)">
          <rect width="290" height="66" rx="8" fill="#030712" stroke="#00F5FF" stroke-opacity="0.4" stroke-width="1.2" />
          <text x="14" y="24" class="sans" font-size="14" font-weight="700" fill="#FFFFFF">🛡️ Sentinel-Guard</text>
