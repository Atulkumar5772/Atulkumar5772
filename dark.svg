      <text x="0" y="44" class="sans" font-size="19" font-weight="700" fill="#FFFFFF">Red Hat Intern • Systems Eng.</text>
      <text x="0" y="66" class="sans text-muted" font-size="13">B.Tech CSE @ Poornima Inst. of Engg. &amp; Tech.</text>

