<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Atul Kumar - Red Hat Intern and Systems Developer Profile Banner">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <linearGradient id="neonCyanViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00F5FF" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Subtle Grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38BDF8" stroke-opacity="0.04" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .text-title { font-size: 32px; font-weight: 800; fill: #FFFFFF; letter-spacing: -0.5px; }
    .text-headline { font-size: 14px; font-weight: 600; fill: #00F5FF; letter-spacing: 0.5px; }
    .text-muted { font-size: 13px; font-weight: 400; fill: #94A3B8; }
    .text-cyan { font-size: 13px; font-weight: 600; fill: #38BDF8; }
    .text-emerald { font-size: 13px; font-weight: 600; fill: #10B981; }
    .text-amber { font-size: 13px; font-weight: 600; fill: #F59E0B; }
    .text-violet { font-size: 13px; font-weight: 600; fill: #A78BFA; }
    .text-white { font-size: 13px; font-weight: 500; fill: #F8FAFC; }
    .ascii-text { font-size: 9.5px; fill: #38BDF8; line-height: 11px; }
    .pill-text { font-size: 11px; font-weight: 600; fill: #F1F5F9; }
  </style>

  <!-- Canvas Outer Background -->
  <rect width="1180" height="610" rx="24" fill="url(#bgGrad)" />
  <rect width="1180" height="610" rx="24" fill="url(#grid)" />
  <rect width="1180" height="610" rx="24" fill="url(#scanlines)" />
  <rect width="1178" height="608" x="1" y="1" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="140" fill="#7C3AED" fill-opacity="0.12" filter="url(#cyanGlow)">
    <animate attributeName="r" values="130;160;130" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="500" r="160" fill="#00F5FF" fill-opacity="0.08" filter="url(#cyanGlow)">
    <animate attributeName="r" values="150;180;150" dur="10s" repeatCount="indefinite" />
  </circle>

