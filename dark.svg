            <rect x="0" y="-10" width="10" height="10" rx="2" fill="#00F5FF" />
            <text x="18" y="0" class="mono val">LinkedIn</text>
            <text x="90" y="0" class="mono dots">...................</text>
            <text x="175" y="0" class="mono" fill="#38BDF8">linkedin.com/in/atul-kumar-454b34380</text>
          </g>

          <!-- LeetCode -->
