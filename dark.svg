        <rect width="392" height="42" rx="8" fill="#050C1A" stroke="#00F5FF" stroke-opacity="0.3" stroke-width="1" />
        <text x="14" y="26" class="mono" font-size="13">
          <tspan fill="#38BDF8">~/profile</tspan> <tspan fill="#94A3B8">$</tspan> <tspan fill="#F8FAFC">build --enterprise-ready</tspan>
          <tspan fill="#00F5FF">
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />_
          </tspan>
        </text>
